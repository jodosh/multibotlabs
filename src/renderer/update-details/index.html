<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MultiBot Update Available</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="titlebar">
      <span class="titlebar-title">Update Available</span>
      <button id="close-button" class="titlebar-close" title="Close">✕</button>
    </div>

    <p id="version-line"></p>
    <pre id="release-notes"></pre>

    <div id="actions">
      <button id="dismiss-button" class="secondary" type="button">
        Don't remind me about this version again
      </button>
      <div id="primary-actions">
        <button id="ok-button" type="button">OK</button>
        <button id="download-button" type="button">Download Update</button>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
