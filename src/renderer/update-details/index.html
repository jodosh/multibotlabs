<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MultiBot Update Available</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="titlebar">
      <span class="titlebar-title">Update Available</span>
      <button id="close-button" class="titlebar-close" title="Close">✕</button>
    </div>

    <p id="version-line"></p>
    <pre id="release-notes"></pre>

    <div id="actions">
      <button id="dismiss-button" type="button">Dismiss</button>
      <button id="view-button" type="button">View Release</button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
