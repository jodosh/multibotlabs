<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MultiBot Settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="titlebar">
      <span class="titlebar-title">MultiBot Settings</span>
      <button id="close-button" class="titlebar-close" title="Close">✕</button>
    </div>

    <section>
      <h2>Integrations</h2>
      <div class="integration-row">
        <span id="twitch-status">Not connected</span>
        <button id="twitch-action-button">Log in with Twitch</button>
      </div>
    </section>

    <section>
      <h2>Available Bots</h2>
      <p class="hint">Drag to reorder. Uncheck "Show" to hide a bot from the main window.</p>
      <ul id="bot-list" class="list"></ul>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
